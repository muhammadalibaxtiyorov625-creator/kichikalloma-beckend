version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kichik_alloma_app
    restart: always
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-educational-space-platform-super-secret-key-2026}
      - BASE_URL=${BASE_URL:-http://189.74.97.98}
    volumes:
      - app_data:/app/database.sqlite
      - app_uploads:/app/public/uploads
      - app_audio:/app/public/audio_cache
    networks:
      - app_network
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: kichik_alloma_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app_network

volumes:
  app_data:
  app_uploads:
  app_audio:

networks:
  app_network:
    driver: bridge
